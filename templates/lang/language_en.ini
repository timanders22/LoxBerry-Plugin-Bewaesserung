; Predictive irrigation - English language file
;
; English is the fallback language, not German: whoever has set a third
; language will more likely understand English. This file must therefore
; always be complete. It is generated, not maintained by hand.
;
; Rules (house standard):
;   - EVERY value is enclosed in double quotes. With parse_ini_file a ';'
;     starts a comment, so an unquoted value would be cut off there. That hits
;     every HTML entity: →, –, ü all end in a semicolon.
;   - No further double quote inside a value. Single-quote HTML attributes
;     instead: <span class='sm-mono'>.
;   - Values that pass through bw_e() in the PHP carry real characters instead
;     of entities, otherwise 'pr&amp;uuml;fen' would appear on screen.
;   - Every key used in the PHP exists in BOTH language files.

