HILFE_MIKRO = "<b>Microclimate</b> corrects evaporation where the garden does not match the open field FAO-56 refers to. Empty or 1.0 = no correction. Rough guide: <b>0.8</b> partial shade (half a day of sun), <b>0.6</b> north side or under deciduous trees, <b>0.4</b> dense full shade. The same applies upwards and is usually forgotten: <b>1.2</b> to <b>1.3</b> in front of a south-facing wall or in a gravel bed, where the wall radiates additional heat. The factor applies to ETc, not to ET0 — the reference evaporation at the site stays the same number for every zone. This is <b>your estimate</b>, not a measurement: if in doubt leave it empty and watch for a season."
