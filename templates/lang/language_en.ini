[ZONE]
BECHER_ERKLAERUNG = "<b>The only honest way to obtain the precipitation rate.</b> Distribute several straight containers of the same size across the zone, run the zone for a known time, measure the depth in the cans and enter the average here. The plugin works out the rate. As long as no measurement exists, all litre and minute figures are estimates and marked with an asterisk — catalogue values regularly deviate by half depending on nozzles, pressure and spacing."
