[LOX]
EINLEITUNG = "The plugin switches no valve. It tells Loxone HOW MUCH water is missing — switching remains with the irrigation block. That way the logic stays where it belongs, and a failure of the plugin does not leave the system without control."
H_TITEL = "Loxone integration, step by step"
K_TOKEN_NEU = "Generate new token"
K_VORLAGE = "Download template for Loxone Config"
S1_TEXT = "A virtual HTTP input with this address and a polling time of 300 seconds."
S1_TITEL = "Step 1: get the values into Loxone"
S2_HINWEIS = "<b>The difference to the previous rain lock:</b> that one locks when it has rained. This one locks when the soil HAS enough water — and after three hot days that is not the case even if it rained the day before yesterday."
S2_TEXT = "The simplest route: <span class='sm-mono'>GIESSEN</span> to the lock input of the irrigation block — then the automation is skipped on days when the soil is moist enough. For finer control, count the cycles and stop once <span class='sm-mono'>DURCHLAEUFE</span> is reached. That is exactly what step 3 builds."
S2_TITEL = "Step 2: what to do with it"
S3_ERLAEUTERUNG = "<b>On #5 and #6:</b> the 0/1 value becomes a clean lock signal. The threshold switch trips at 0.5 — a plain comparison against 0 would be risky with an analogue value.<br><b>On #7:</b> the counter counts the completed cycles of the night. It is reset at the start of the window — otherwise it keeps counting into the second night.<br><b>On #8 and #9:</b> as soon as the counter reaches the planned number, watering stops. Both routes — no demand and target reached — lead through an OR to the same stop input.<br><b>On #11 and #12:</b> the alert is the real gain: it says the garden needs more than the well can give. Without it you notice only when the lawn turns brown."
S3_TEXT = "What is rebuilt: the automation only runs when there is demand, and stops once the planned cycles are done. Plus an alert when the system cannot cover the demand. Loxone Config lists all blocks in the block search (F5)."
S3_TITEL = "Step 3: complete block list to rebuild one to one"
S4_TEXT = "The endpoint sits in the unauthenticated area so Loxone can reach it without credentials, and is therefore protected by a token. It only delivers values — it cannot switch anything. A new token invalidates the address already entered."
S4_TITEL = "Step 4: the token"
TOKEN_FRAGE = "Afterwards the address in Loxone Config has to be renewed. Really?"
TOKEN_NEU = "A new token has been generated. <b>The address in Loxone has to be adjusted.</b>"
