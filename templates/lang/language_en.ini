[ZONE]
BECHER_ERKLAERUNG = "<b>The only honest way to obtain the precipitation rate.</b> Distribute several straight containers of the same size across the zone, run the zone for a known time, measure the depth in the cans and enter the average here. The plugin works out the rate. As long as no measurement exists, all litre and minute figures are estimates and marked with an asterisk — catalogue values regularly deviate by half depending on nozzles, pressure and spacing."
BECHER_OK = "%s: the rate is %.2f mm/h. Litres and minutes are measured from now on, not estimated."
ERKLAERUNG = "One row per irrigation circuit. Area and planting determine the demand, the soil determines how much water it can hold at all. The key is the name under which the zone appears in MQTT and at the endpoint — lower case, digits, hyphen. A row without a name is not saved."
FEHLER_AUSWAHL = "%s: planting or soil is unknown."
FEHLER_BECHER = "Run time and measured depth have to be numbers greater than zero."
FEHLER_DOPPELT = "The key '%s' exists twice."
FEHLER_FLAECHE = "%s: the area must be a number from 0 to 100000."
FEHLER_MIKRO = "%s: the microclimate factor must be between 0.3 and 1.5. Leaving it empty means 1.0."
FEHLER_RATE = "%s: the rate must be a number from 0 to 200."
FEHLER_SCHLUESSEL = "%s: the key is missing or contains disallowed characters."
FEHLER_THETA = "Zone %s: the wilting point must be smaller than the field capacity. Both fields stay empty, the soil type applies."
FEHLER_UNBEKANNT = "That zone does not exist."
FEIN_ERKLAERUNG = "Everything here is optional. An empty field behaves exactly as the plugin behaved up to 0.9.6."
FEIN_FUSSNOTE = "Duration: empty means the general duration from Settings. Plant height: only with it does the plugin adjust the crop coefficient for dry air and wind. Slope: share of rain running off the surface, 0 to 1. Sensor weight: how strongly a soil moisture probe pulls the calculated state towards itself."
FUSSNOTE = "An asterisk on planting or soil means: the value is a guideline figure and does not appear as such in FAO-56. Uncheck „in cycle“ for circuits that run manually — a tap, for instance."
