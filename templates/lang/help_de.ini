; Hilfetexte, deutsch. Gehoert zu templates/help/help.html.
; LBWeb::gethelp() leitet den Namen dieser Datei aus dem Namen der
; Hilfedatei ab und sucht sie in templates/lang/ - nicht neben der
; Hilfe. Jeder Wert steht in doppelten Anfuehrungszeichen und enthaelt
; selbst keine; Auszeichnung bleibt roh, die Hilfe wird nicht
; maskiert ausgegeben.

[HILFE]
K01 = "Bewässerung vorausschauend"
K02 = "<b>Gießen nach Wasserbilanz statt nach Zeitplan.</b> Das Plugin rechnet nach dem Standardverfahren <b>FAO-56</b> aus, wie viel Wasser der Boden je Zone verloren hat, zieht den erwarteten Regen der nächsten Tage ab und sagt Loxone, wie viele Durchläufe heute Nacht nötig sind."
K03 = "Es kennt keine Wetterstation — und das ist Absicht"
K04 = "Das Plugin kennt nur <i>Messgrößen</i> und drei Wege: ein MQTT-Thema, eine JSON-Antwort per HTTP, oder Open-Meteo. Ob dahinter Ecowitt, WeeWX, Davis, WeatherFlow, ein Shelly oder ein selbstgebauter Sensor steckt, ist ihm gleich. Vorlagen für die gängigen Systeme gibt es im Reiter <i>Quellen</i>; jedes Feld lässt sich danach von Hand ändern."
K05 = "<b>Es fällt einzeln zurück, nicht als Ganzes:</b> wer nur einen Regenmesser hat, bekommt seinen echten Regen und die übrigen Größen aus dem Modell. Die Spalte <i>Zuletzt von</i> zeigt je Größe, woher sie wirklich kam."
K06 = "Ohne Standort geht nichts"
K07 = "Die Verdunstung hängt an der Sonneneinstrahlung, und die hängt am Sonnenstand. Ohne Koordinaten rechnet das Plugin nicht."
K08 = "Die Becherprobe"
K09 = "Millimeter kann das Plugin rechnen. Liter und Minuten kann es nur, wenn es weiß, wie viel Wasser Ihre Regner in einer Stunde ausbringen. Diese Zahl steht in keinem Katalog verlässlich — sie hängt an Düsen, Druck und Verlegeabstand und weicht regelmäßig um die Hälfte ab."
K10 = "Deshalb: mehrere gerade Behälter gleicher Größe in der Zone verteilen, die Zone 15 Minuten laufen lassen, die Höhe messen, Mittelwert im Reiter <i>Zonen</i> eintragen. Bis dahin sind alle Liter- und Minutenangaben mit einem Stern als geschätzt gekennzeichnet."
K11 = "So gehen Sie vor"
K12 = "<b>Einstellungen:</b> Standort eintragen, Grenzen der Anlage (Zonendauer, Pause, Zeitfenster), Dienst starten."
K13 = "<b>Quellen:</b> Vorlage wählen oder bei Open-Meteo bleiben."
K14 = "<b>Zonen:</b> je Kreis Fläche, Bepflanzung, Boden."
K15 = "<b>Test:</b> <i>Jetzt rechnen</i> — danach steht in der Selbstprüfung, woher jede Größe kam."
K16 = "<b>MQTT:</b> Abo im Gateway eintragen."
K17 = "<b>Einbindung in Loxone:</b> virtueller Eingang, dann die Baustein-Liste."
K18 = "Die Bilanz braucht Anlauf"
K19 = "Am ersten Tag kennt das Plugin nur einen Tag Verdunstung. Erst nach etwa einer Woche ist der Wasserhaushalt eingeschwungen. Solange lieber etwas mehr gießen als zu wenig."
K20 = "<b>Der Boden ist der beste Prüfer:</b> nach zwei Wochen einmal mit dem Spaten nachsehen. Steht der Füllstand bei 60 Prozent und der Boden ist staubtrocken, stimmt die Bodenart nicht — im Reiter <i>Zonen</i> ändern."
K21 = "Was geprüft ist"
K22 = "Die Rechnung selbst: sie reproduziert das veröffentlichte <b>Rechenbeispiel 18 aus FAO-56</b> (Uccle, 6. Juli) auf drei Nachkommastellen — jeder Zwischenwert einzeln, nicht nur das Ergebnis."
K23 = "<b>Nicht geprüft</b> ist, ob die Themen und Pfade zu Ihrer Station passen, ob Ihre Bodenfeuchtesensoren plausible Werte liefern und ob die Niederschlagsrate stimmt. Das zeigt nur der Betrieb."
K24 = "Grundlage"
K25 = "FAO Irrigation and Drainage Paper 56 (Allen, Pereira, Raes, Smith). Vorhersagedaten von Open-Meteo, kostenlos und ohne Schlüssel für nicht gewerbliche Nutzung, ebenfalls nach FAO-56 Penman-Monteith gerechnet."
