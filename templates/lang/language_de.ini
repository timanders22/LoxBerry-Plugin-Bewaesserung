[LOX]
EINLEITUNG = "Das Plugin schaltet kein Ventil. Es sagt Loxone, WIE VIEL Wasser fehlt — geschaltet wird weiter vom Bewässerungsbaustein. So bleibt die Logik dort, wo sie hingehört, und ein Ausfall des Plugins lässt die Anlage nicht ohne Steuerung zurück."
