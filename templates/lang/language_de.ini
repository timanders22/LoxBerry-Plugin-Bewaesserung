HILFE_MIKRO = "<b>Mikroklima</b> korrigiert die Verdunstung dort, wo der Garten nicht der freien Fläche entspricht, auf die sich FAO-56 bezieht. Leer oder 1,0 = keine Korrektur. Anhaltswerte: <b>0,8</b> Halbschatten (halber Tag Sonne), <b>0,6</b> Nordseite oder unter Laubbäumen, <b>0,4</b> dichter Vollschatten. Nach oben gilt dasselbe und wird meist vergessen: <b>1,2</b> bis <b>1,3</b> vor einer Südmauer oder im Kiesbeet, wo die Wand zusätzlich Wärme abgibt. Der Faktor wirkt auf ETc, nicht auf ET0 — die Verdunstung der Grasreferenz am Standort bleibt für alle Zonen dieselbe Zahl. Das ist eine <b>Schätzung durch Sie</b>, keine Messung: wer unsicher ist, lässt das Feld leer und beobachtet eine Saison."
