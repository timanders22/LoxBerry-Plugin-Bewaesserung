[ZONE]
BECHER_ERKLAERUNG = "<b>Die einzige ehrliche Art, an die Niederschlagsrate zu kommen.</b> Mehrere gerade Behälter gleicher Größe in der Zone verteilen, die Zone eine bekannte Zeit laufen lassen, die Höhe im Becher messen und den Mittelwert hier eintragen. Das Plugin rechnet die Rate aus. Solange keine Messung vorliegt, sind alle Liter- und Minutenangaben geschätzt und mit einem Stern gekennzeichnet — Katalogwerte weichen je nach Düsen, Druck und Verlegeabstand regelmäßig um die Hälfte ab."
