S1_TITEL = "Schritt 1: Werte in Loxone holen"
S2_HINWEIS = "<b>Der Unterschied zur bisherigen Regensperre:</b> die sperrt, wenn es geregnet hat. Diese hier sperrt, wenn der Boden genug Wasser HAT — und das ist nach drei heißen Tagen auch dann nicht der Fall, wenn es vorgestern geregnet hat."
S2_TEXT = "Der einfachste Weg: <span class='sm-mono'>GIESSEN</span> an den Sperr-Eingang des Bewässerungsbausteins — dann fällt die Automatik an Tagen aus, an denen der Boden feucht genug ist. Wer feiner steuern will, zählt die Durchläufe mit und stoppt, sobald <span class='sm-mono'>DURCHLAEUFE</span> erreicht ist. Genau das baut Schritt 3 nach."
S2_TITEL = "Schritt 2: Was damit anfangen"
S3_ERLAEUTERUNG = "<b>Zu #5 und #6:</b> Aus dem Wert 0/1 wird ein sauberes Sperrsignal. Der Schwellwertschalter schaltet bei 0,5 — ein einfacher Vergleich auf 0 wäre bei einem Analogwert riskant.<br><b>Zu #7:</b> Der Zähler zählt die abgeschlossenen Durchläufe der Nacht. Er wird beim Fensterbeginn zurückgesetzt — sonst zählt er die zweite Nacht weiter.<br><b>Zu #8 und #9:</b> Sobald der Zähler die geplante Zahl erreicht, wird gestoppt. Beide Wege — kein Bedarf und Soll erreicht — führen über ein ODER auf denselben Stopp-Eingang.<br><b>Zu #11 und #12:</b> Die Meldung ist der eigentliche Gewinn: sie sagt, dass der Garten mehr braucht, als der Brunnen hergibt. Ohne sie merkt man es erst am braunen Rasen."
S3_TEXT = "Nachgebaut wird: die Automatik läuft nur, wenn Bedarf besteht, und hört auf, sobald die geplanten Durchläufe erledigt sind. Dazu eine Meldung, wenn die Anlage den Bedarf nicht decken kann. Loxone Config führt alle Bausteine in der Baustein-Suche (F5)."
S3_TITEL = "Schritt 3: Komplette Baustein-Liste zum 1:1-Nachbauen"
S4_TEXT = "Der Endpunkt liegt im unangemeldeten Bereich, damit Loxone ihn ohne Zugangsdaten erreicht, und ist deshalb durch ein Token geschützt. Er liefert nur Werte — schalten kann er nichts. Ein neues Token macht die eingetragene Adresse ungültig."
