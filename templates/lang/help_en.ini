; Help texts, english. Belongs to templates/help/help.html.
; LBWeb::gethelp() derives the name of this file from the name of the help
; file and looks for it in templates/lang/ - not next to the help file.
; Every value is wrapped in double quotes and contains none itself; markup
; stays raw, the help text is not output escaped.

[HILFE]
K01 = "Forward-looking irrigation"
K02 = "<b>Watering by water balance instead of by timer.</b> Using the standard method <b>FAO-56</b>, the plugin works out how much water the soil has lost in each zone, subtracts the rain expected over the coming days and tells Loxone how many runs are needed tonight."
K03 = "It knows no weather station — and that is deliberate"
K04 = "The plugin only knows <i>quantities</i> and three routes: an MQTT topic, a JSON reply over HTTP, or Open-Meteo. Whether an Ecowitt, WeeWX, Davis, WeatherFlow, a Shelly or a home-built sensor sits behind it makes no difference to it. Templates for the common systems are on the <i>Sources</i> tab; every field can be changed by hand afterwards."
K05 = "<b>It falls back per quantity, not as a whole:</b> if you only have a rain gauge, you get your real rainfall and the remaining quantities from the model. The <i>Last from</i> column shows for each quantity where it really came from."
K06 = "Nothing works without a location"
K07 = "Evaporation depends on solar radiation, and that depends on the position of the sun. Without coordinates the plugin does not calculate."
K08 = "The cup test"
K09 = "Millimetres the plugin can calculate. Litres and minutes it can only calculate if it knows how much water your sprinklers deliver in an hour. That figure is in no catalogue reliably — it depends on nozzles, pressure and spacing and regularly differs by half."
K10 = "So: distribute several straight-sided containers of the same size across the zone, run the zone for 15 minutes, measure the depth, enter the average on the <i>Zones</i> tab. Until then every figure in litres and minutes is marked with an asterisk as estimated."
K11 = "How to proceed"
K12 = "<b>Settings:</b> enter the location, the limits of the system (zone duration, pause, time window), start the service."
K13 = "<b>Sources:</b> choose a template or stay with Open-Meteo."
K14 = "<b>Zones:</b> area, planting and soil for each circuit."
K15 = "<b>Test:</b> <i>Calculate now</i> — afterwards the self-check states where each quantity came from."
K16 = "<b>MQTT:</b> enter the subscription in the gateway."
K17 = "<b>Loxone integration:</b> a virtual input, then the list of blocks."
K18 = "The balance needs a run-up"
K19 = "On the first day the plugin only knows one day of evaporation. Only after about a week has the water balance settled. Until then, rather water a little too much than too little."
K20 = "<b>The soil is the best judge:</b> after two weeks, take a spade and look. If the level reads 60 per cent and the soil is bone dry, the soil type is wrong — change it on the <i>Zones</i> tab."
K21 = "What has been verified"
K22 = "The calculation itself: it reproduces the published <b>worked example 18 from FAO-56</b> (Uccle, 6 July) to three decimal places — every intermediate value individually, not just the result."
K23 = "<b>Not verified</b> is whether the topics and paths match your station, whether your soil moisture sensors deliver plausible values and whether the precipitation rate is right. Only running it will show that."
K24 = "Basis"
K25 = "FAO Irrigation and Drainage Paper 56 (Allen, Pereira, Raes, Smith). Forecast data from Open-Meteo, free and without a key for non-commercial use, likewise calculated according to FAO-56 Penman-Monteith."
