[AUTHOR]
NAME=Bewaesserung Plugin Authors
EMAIL=bewaesserung@users.noreply.github.com

[PLUGIN]
VERSION=0.9.18
NAME=bewaesserung
FOLDER=bewaesserung
TITLE=Bewaesserung vorausschauend

[AUTOUPDATE]
# Selbstaktualisierung ueber das EIGENE Repository. Beide Adressen zeigen auf
# den Zweig master - LoxBerry liest die Fassung dort und vergleicht sie mit der
# oben. Solange beide 0.9.0 lauten, wird niemandem etwas angeboten; sobald der
# Zweig 1.0.0 fuehrt, greift die Aktualisierung von selbst.
#
# Adressen NIE auf ein fremdes Repository richten - LoxBerry vergleicht
# Fassungen als Zahl, und ein fremdes 2021.05.14 waere groesser als 1.0.0.
# Daraus wuerde ein stilles Downgrade (Hausregel, belegt am Docker-Plugin).
AUTOMATIC_UPDATES=true
RELEASECFG=https://raw.githubusercontent.com/timanders22/LoxBerry-Plugin-Bewaesserung/master/release.cfg
PRERELEASECFG=https://raw.githubusercontent.com/timanders22/LoxBerry-Plugin-Bewaesserung/master/prerelease.cfg

[SYSTEM]
INTERFACE=2.0
REBOOT=false
LB_MINIMUM=3.0.0
LB_MAXIMUM=false
# Reines Python, keine uebersetzten Pakete noetig.
ARCHITECTURE=false
